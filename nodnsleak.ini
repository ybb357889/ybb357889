ruleset=DIRECT,https://raw.githubusercontent.com/ybb357889/ybb357889/refs/heads/main/mychinadomain.list
; 2026-09-17 修正：去掉 no-resolve
; mihomo 的 no-resolve 语义是「目标是域名时跳过本条规则」，而 fake-ip 模式下所有未命中
; 前置规则的域名都是以域名形式进入匹配的 —— 加 no-resolve 等于这条兜底对域名永远失效，
; 结果全部落到 FINAL(走代理)。去掉后 mihomo 先解析再判 GeoIP，解析到国内 IP 的自动直连。
; 已实测：GFW 污染返回的都是境外黑洞 IP(185.45.5.35 / 69.171.235.22 / 124.11.210.175)，
; 不会落进 CN 段，因此去掉 no-resolve 不会把被墙域名误判成直连。
ruleset=DIRECT,[]GEOIP,CN
ruleset=🚀 节点选择,[]FINAL

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`[]马来节点`[]香港节点`[]泰国节点`[]美国节点`[]新加坡节点`
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

# 各地区节点：正则建议加上更多常见关键词，并确保分隔符正确
custom_proxy_group=马来节点`url-test`(马来|Malaysia|MY)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=香港节点`url-test`(香港|HongKong|Hong Kong|HK|CN)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=泰国节点`url-test`(泰国|Thailand|TH)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=美国节点`url-test`(美国|USA|US|States)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=新加坡节点`url-test`(新加坡|Singapore|SG)`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
